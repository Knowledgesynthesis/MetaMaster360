<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Learn and run every step of a systematic review and meta-analysis — question, protocol, search, screening, extraction, risk of bias, pooling, GRADE and PRISMA 2020 reporting — with working calculators aligned to the Cochrane Handbook v6.5." />
    <meta name="theme-color" content="#0b1120" />
    <title>MetaMaster360 — Systematic Review & Meta-Analysis Lab</title>
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('mm360-progress') || '{}').state?.theme || 'system'
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>MetaMaster360 needs JavaScript to run its interactive labs.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
